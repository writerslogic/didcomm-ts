<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>didcomm-ts chat</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem;
  }
  h1 { font-size: 1.1rem; margin-bottom: 0.25rem; }
  #identity {
    font-size: 0.8rem;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    word-break: break-all;
    opacity: 0.75;
    margin-bottom: 1rem;
  }
  #log {
    border: 1px solid #8884;
    border-radius: 6px;
    height: 320px;
    overflow-y: auto;
    padding: 0.5rem;
    margin-bottom: 1rem;
  }
  .entry { margin-bottom: 0.5rem; }
  .entry .meta {
    font-size: 0.7rem;
    opacity: 0.6;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .entry.sent { text-align: right; }
  .entry .bubble {
    display: inline-block;
    padding: 0.4rem 0.6rem;
    border-radius: 8px;
    max-width: 85%;
  }
  .entry.sent .bubble { background: #2563eb; color: white; }
  .entry.received .bubble { background: #8884; }
  form { display: grid; gap: 0.4rem; }
  label { font-size: 0.75rem; opacity: 0.75; }
  input, textarea {
    font: inherit;
    padding: 0.4rem;
    border-radius: 4px;
    border: 1px solid #8884;
  }
  button {
    font: inherit;
    padding: 0.5rem;
    border-radius: 4px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #error {
    color: #dc2626;
    font-size: 0.85rem;
    min-height: 1.2em;
    margin-top: 0.4rem;
  }
</style>
</head>
<body>
  <h1>didcomm-ts chat</h1>
  <div id="identity">loading identity…</div>

  <div id="log"></div>

  <form id="send-form">
    <label for="peerDid">Peer DID</label>
    <input id="peerDid" name="peerDid" placeholder="did:key:z... or did:web:..." required />

    <label for="endpoint">Endpoint URL</label>
    <input id="endpoint" name="endpoint" placeholder="https://peer.example.com" required />

    <label for="text">Message</label>
    <textarea id="text" name="text" rows="2" required></textarea>

    <button id="send-button" type="submit">Send</button>
  </form>
  <div id="error"></div>

<script>
(function () {
  "use strict";

  var identityEl = document.getElementById("identity");
  var logEl = document.getElementById("log");
  var errorEl = document.getElementById("error");
  var formEl = document.getElementById("send-form");
  var sendButton = document.getElementById("send-button");

  var TOKEN_KEY = "didcomm-ts-api-token";
  var polling = true;

  function getStoredToken() {
    try {
      return sessionStorage.getItem(TOKEN_KEY);
    } catch (_err) {
      return null;
    }
  }

  function setStoredToken(token) {
    try {
      if (token === null) sessionStorage.removeItem(TOKEN_KEY);
      else sessionStorage.setItem(TOKEN_KEY, token);
    } catch (_err) {
      /* sessionStorage unavailable (e.g. private mode); token just won't persist across reloads */
    }
  }

  function getApiToken() {
    var token = getStoredToken();
    if (token) return token;
    token = window.prompt("Enter the API token printed on the server's stderr at startup:");
    if (!token) return null;
    setStoredToken(token);
    return token;
  }

  /** fetch wrapper for /api/* calls: attaches the Authorization header, and on a 401 clears the stored token and stops polling (a bad/stale token must not spam prompt() from the poll loop). */
  function apiFetch(url, opts) {
    var token = getApiToken();
    opts = opts || {};
    opts.headers = opts.headers || {};
    if (token) opts.headers["Authorization"] = "Bearer " + token;
    return fetch(url, opts).then(function (res) {
      if (res.status === 401) {
        setStoredToken(null);
        polling = false;
        errorEl.textContent = "invalid API token; reload the page to re-enter it";
      }
      return res;
    });
  }

  function loadIdentity() {
    apiFetch("/api/identity")
      .then(function (res) {
        if (!res.ok) throw new Error("failed to load identity");
        return res.json();
      })
      .then(function (data) {
        identityEl.textContent = "identity: " + data.did;
      })
      .catch(function () {
        identityEl.textContent = "identity: (failed to load)";
      });
  }

  function renderLog(entries) {
    var wasAtBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 4;
    logEl.textContent = "";
    entries.forEach(function (entry) {
      var wrapper = document.createElement("div");
      wrapper.className = "entry " + (entry.direction === "sent" ? "sent" : "received");

      var meta = document.createElement("div");
      meta.className = "meta";
      var when = new Date(entry.timestamp).toLocaleTimeString();
      meta.textContent = (entry.direction === "sent" ? "to " : "from ") + entry.peerDid + " · " + when;

      var bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = entry.text;

      wrapper.appendChild(meta);
      wrapper.appendChild(bubble);
      logEl.appendChild(wrapper);
    });
    if (wasAtBottom) logEl.scrollTop = logEl.scrollHeight;
  }

  function pollMessages() {
    if (!polling) return;
    apiFetch("/api/messages")
      .then(function (res) {
        if (!res.ok) throw new Error("poll failed");
        return res.json();
      })
      .then(renderLog)
      .catch(function () {
        /* a transient poll failure is not worth surfacing as a send error */
      });
  }

  formEl.addEventListener("submit", function (event) {
    event.preventDefault();
    errorEl.textContent = "";
    sendButton.disabled = true;

    var payload = {
      peerDid: document.getElementById("peerDid").value.trim(),
      endpoint: document.getElementById("endpoint").value.trim(),
      text: document.getElementById("text").value,
    };

    apiFetch("/api/send", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok || !data.ok) {
            throw new Error((data && data.error) || ("send failed (" + res.status + ")"));
          }
          return data;
        });
      })
      .then(function () {
        document.getElementById("text").value = "";
        pollMessages();
      })
      .catch(function (err) {
        errorEl.textContent = err.message || String(err);
      })
      .finally(function () {
        sendButton.disabled = false;
      });
  });

  loadIdentity();
  pollMessages();
  setInterval(pollMessages, 2000);
})();
</script>
</body>
</html>
