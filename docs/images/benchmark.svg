<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title id="t">didcomm-ts vs didcomm-rust (WASM) throughput</title>
<desc id="d">Median operations per second for pack and unpack, 1024-byte messages, Apple M4, Node v26.8.1. X25519 authcrypt · pack: didcomm-ts 2820, didcomm-rust 1020; X25519 authcrypt · unpack: didcomm-ts 3368, didcomm-rust 1375; X25519 anoncrypt · pack: didcomm-ts 3373, didcomm-rust 2219; X25519 anoncrypt · unpack: didcomm-ts 3954, didcomm-rust 2043; P-256 authcrypt · pack: didcomm-ts 1402, didcomm-rust 137; P-256 authcrypt · unpack: didcomm-ts 1419, didcomm-rust 210; P-256 anoncrypt · pack: didcomm-ts 2199, didcomm-rust 316; P-256 anoncrypt · unpack: didcomm-ts 2058, didcomm-rust 318.</desc>
<style>
  .bg { fill: #fcfcfb } .primary { fill: #0b0b0b } .secondary { fill: #52514e } .muted { fill: #898781 }
  .grid { stroke: #e1e0d9; stroke-width: 1 } .ts { fill: #2a78d6 } .rust { fill: #eb6834 }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19 } .primary { fill: #ffffff } .secondary { fill: #c3c2b7 }
    .grid { stroke: #2c2c2a } .ts { fill: #3987e5 } .rust { fill: #d95926 }
  }
</style>
<rect class="bg" width="820" height="500" rx="8"/>
<text class="primary" x="24" y="34" font-size="16" font-weight="600">Throughput: didcomm-ts vs didcomm-rust (WASM)</text>
<text class="secondary" x="24" y="54">Median ops/s, higher is better · 1024-byte message · Apple M4 · Node v26.8.1</text>
<rect class="ts" x="24" y="68" width="12" height="12" rx="2"/><text class="secondary" x="42" y="78">didcomm-ts</text>
<rect class="rust" x="130" y="68" width="12" height="12" rx="2"/><text class="secondary" x="148" y="78">didcomm-rust (WASM)</text>
<line class="grid" x1="210" x2="210" y1="88" y2="456"/><text class="muted" x="210" y="474" text-anchor="middle">0</text>
<line class="grid" x1="332.5" x2="332.5" y1="88" y2="456"/><text class="muted" x="332.5" y="474" text-anchor="middle">1,000</text>
<line class="grid" x1="455" x2="455" y1="88" y2="456"/><text class="muted" x="455" y="474" text-anchor="middle">2,000</text>
<line class="grid" x1="577.5" x2="577.5" y1="88" y2="456"/><text class="muted" x="577.5" y="474" text-anchor="middle">3,000</text>
<line class="grid" x1="700" x2="700" y1="88" y2="456"/><text class="muted" x="700" y="474" text-anchor="middle">4,000</text>
<text class="secondary" x="198" y="112" text-anchor="end">X25519 authcrypt · pack</text><path class="ts" d="M210,96 h341.45000000000005 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-341.45000000000005 z"><title>2,820 ops/s</title></path><path class="rust" d="M210,110 h120.94999999999999 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-120.94999999999999 z"><title>1,020 ops/s</title></path><text class="primary" x="563.45" y="112">2.8× faster</text>
<text class="secondary" x="198" y="156" text-anchor="end">X25519 authcrypt · unpack</text><path class="ts" d="M210,140 h408.5799999999999 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-408.5799999999999 z"><title>3,368 ops/s</title></path><path class="rust" d="M210,154 h164.4375 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-164.4375 z"><title>1,375 ops/s</title></path><text class="primary" x="630.5799999999999" y="156">2.4× faster</text>
<text class="secondary" x="198" y="200" text-anchor="end">X25519 anoncrypt · pack</text><path class="ts" d="M210,184 h409.1925000000001 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-409.1925000000001 z"><title>3,373 ops/s</title></path><path class="rust" d="M210,198 h267.8275 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-267.8275 z"><title>2,219 ops/s</title></path><text class="primary" x="631.1925000000001" y="200">1.5× faster</text>
