<text class="secondary" x="198" y="288" text-anchor="end">P-256 authcrypt · pack</text><path class="ts" d="M210,272 h167.745 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-167.745 z"><title>1,402 ops/s</title></path><path class="rust" d="M210,286 h12.782499999999999 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-12.782499999999999 z"><title>137 ops/s</title></path><text class="primary" x="389.745" y="288">10.2× faster</text>
<text class="secondary" x="198" y="332" text-anchor="end">P-256 authcrypt · unpack</text><path class="ts" d="M210,316 h169.8275 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-169.8275 z"><title>1,419 ops/s</title></path><path class="rust" d="M210,330 h21.724999999999994 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-21.724999999999994 z"><title>210 ops/s</title></path><text class="primary" x="391.8275" y="332">6.8× faster</text>
<text class="secondary" x="198" y="376" text-anchor="end">P-256 anoncrypt · pack</text><path class="ts" d="M210,360 h265.3775 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-265.3775 z"><title>2,199 ops/s</title></path><path class="rust" d="M210,374 h34.71000000000001 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-34.71000000000001 z"><title>316 ops/s</title></path><text class="primary" x="487.3775" y="376">7.0× faster</text>
<text class="secondary" x="198" y="420" text-anchor="end">P-256 anoncrypt · unpack</text><path class="ts" d="M210,404 h248.10500000000002 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-248.10500000000002 z"><title>2,058 ops/s</title></path><path class="rust" d="M210,418 h34.954999999999984 a4,4 0 0 1 4,4 v4 a4,4 0 0 1 -4,4 h-34.954999999999984 z"><title>318 ops/s</title></path><text class="primary" x="470.105" y="420">6.5× faster</text>
<text class="muted" x="455" y="492" text-anchor="middle">operations per second</text>
