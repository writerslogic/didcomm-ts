<svg xmlns="http://www.w3.org/2000/svg" width="820" height="852" viewBox="0 0 820 852" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<title id="t">didcomm-ts vs didcomm-rust (WASM) throughput</title>
<desc id="d">Median operations per second for pack and unpack, 1024-byte messages, Apple M4, Node v26.8.1. X25519 authcrypt pack · reused keys: didcomm-ts 3254, didcomm-rust 1299; X25519 authcrypt unpack · reused keys: didcomm-ts 4085, didcomm-rust 1395; X25519 anoncrypt pack · reused keys: didcomm-ts 4608, didcomm-rust 2696; X25519 anoncrypt unpack · reused keys: didcomm-ts 5705, didcomm-rust 2754; X25519 authcrypt pack · fresh keys: didcomm-ts 1684, didcomm-rust 1069; X25519 authcrypt unpack · fresh keys: didcomm-ts 1989, didcomm-rust 1257; X25519 anoncrypt pack · fresh keys: didcomm-ts 3207, didcomm-rust 2295; X25519 anoncrypt unpack · fresh keys: didcomm-ts 2813, didcomm-rust 2276; P-256 authcrypt pack · reused keys: didcomm-ts 2024, didcomm-rust 215; P-256 authcrypt unpack · reused keys: didcomm-ts 1866, didcomm-rust 262; P-256 anoncrypt pack · reused keys: didcomm-ts 3285, didcomm-rust 446; P-256 anoncrypt unpack · reused keys: didcomm-ts 3095, didcomm-rust 407; P-256 authcrypt pack · fresh keys: didcomm-ts 1784, didcomm-rust 246; P-256 authcrypt unpack · fresh keys: didcomm-ts 1727, didcomm-rust 323; P-256 anoncrypt pack · fresh keys: didcomm-ts 3169, didcomm-rust 510; P-256 anoncrypt unpack · fresh keys: didcomm-ts 2755, didcomm-rust 474.</desc>
